<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SHIFT — Official Store</title>
    <style>
        body { margin: 0; font-family: monospace; background-color: #ffffff; color: #000000; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 2px solid #000000; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        nav a { text-decoration: none; color: #000000; margin-left: 30px; font-size: 16px; text-transform: uppercase; font-weight: bold;}
        nav a:hover { text-decoration: underline; }
        
        .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; border-bottom: 2px solid #000000; background: #fafafa;}
        .hero img { max-width: 100%; height: 400px; object-fit: cover; border: 2px solid #000000; box-shadow: 5px 5px 0px #000000; margin-bottom: 30px; }
        .hero h1 { font-size: 32px; text-transform: uppercase; margin-bottom: 10px; }
        .hero p { font-size: 16px; max-width: 500px; margin-bottom: 25px; color: #555; }
        .btn { display: inline-block; background: #000000; color: #ffffff; padding: 15px 40px; text-decoration: none; font-weight: bold; text-transform: uppercase; border: 2px solid #000000; transition: 0.2s; }
        .btn:hover { background: #ffffff; color: #000000; box-shadow: 4px 4px 0px #000000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SHIFT®</div>
        <nav>
            <a href="#">Магазин</a>
            <a href="#">Коллекции</a>
            <a href="#">О нас</a>
        </nav>
    </header>

    <section class="hero">
        <!-- Вставили стильную гранж-фотку одежды для примера -->
        <img src="https://unsplash.com" alt="Mersh">
        <h1>Новая капсула / СИСТЕМА-404</h1>
        <p>Техно-ностальгия, оверсайз крой и плотный хлопок. Сделано для тех, кто понимает.</p>
        <a href="#" class="btn">Смотреть дроп</a>
    </section>

</body>
</html>
